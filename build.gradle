plugins {
    id 'java'
}

allprojects {
    group = 'com.sugar_tree'
    version = '1.0-dev'
}

subprojects {
    apply plugin: 'java'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

java {
    // Hook modules target newer Java than the plugin itself; each is only loaded on its own server version.
    disableAutoTargetJvm()
}

dependencies {
    // Built against the oldest supported API so the jar runs on Spigot/Paper 1.13+.
    // The criterion grant events (Paper 1.13.2+, Spigot 26.3+) are hooked by reflection at runtime.
    compileOnly("org.spigotmc:spigot-api:1.13-R0.1-SNAPSHOT") {
        // Old bungeecord-chat snapshot is no longer hosted, and this plugin doesn't use it
        exclude group: 'net.md-5', module: 'bungeecord-chat'
    }
    compileOnly project(':hook:api')
    compileOnly project(':hook:spigot-26.2')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(8)
}

jar {
    // Bundle the hook modules' classes into the plugin jar
    from(project(':hook:api').sourceSets.main.output)
    from(project(':hook:spigot-26.2').sourceSets.main.output)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
